name: DXB -> China Flight Scan

on:
  # Every day at 07:00 UTC = 11:00 Dubai / 15:00 China.
  # Adjust to taste; Travelpayouts cache refreshes every few hours.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write          # needed to commit price_history.json back

concurrency:
  group: dxb-cn-flights
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

          CURRENCY:            ${{ vars.CURRENCY }}
          ORIGINS:             ${{ vars.ORIGINS }}
          ROLLING_WINDOW_DAYS: ${{ vars.ROLLING_WINDOW_DAYS }}
          ROLLING_DROP_PCT:    ${{ vars.ROLLING_DROP_PCT }}
          TARGET_MARGIN_PCT:   ${{ vars.TARGET_MARGIN_PCT }}
          MONTHS_AHEAD:        ${{ vars.MONTHS_AHEAD }}
          MAX_NIGHTS:          ${{ vars.MAX_NIGHTS }}
          WATCHLIST:           ${{ vars.WATCHLIST }}
          HEARTBEAT:           ${{ vars.HEARTBEAT }}
          MUTE:                ${{ vars.MUTE }}
          BROAD_FALLBACK:      ${{ vars.BROAD_FALLBACK }}
        run: python check_flights.py

      - name: Commit price history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          if git diff --cached --quiet; then
            echo "No price history changes to commit."
          else
            git commit -m "chore: update price history [skip ci]"
            git push
          fi